<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Happy birthday, sunshine. Flowers, just for you."><title>Happy birthday, sunshine</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#f5eacb;font-family:Georgia,'Times New Roman',serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom));gap:12px}.flowers{position:relative;overflow:hidden;background:#000;width:min(96vw,calc(68svh * .64968),440px);aspect-ratio:408/628;flex-shrink:0}.flowers video{display:block;position:absolute;width:176.470588%;max-width:none;left:-38.235294%;top:-15.923567%;filter:brightness(1.32) contrast(1.12) saturate(1.1);pointer-events:none}h1{font-size:clamp(24px,6.4vw,31px);font-weight:400;letter-spacing:-.02em;line-height:1.18;text-align:center;margin:0}h1 span{display:block;margin-top:4px;color:#f1d79d;font-style:italic;font-size:1.1em}button{position:static;min-height:46px;min-width:190px;margin-top:6px;touch-action:manipulation;border:1px solid #8c7c5a;background:#000;color:#f5eacb;border-radius:24px;font:16px Georgia;padding:10px 20px}button:disabled{opacity:.55}#status{min-height:18px;font:14px/1.3 system-ui,sans-serif;color:#b8ad97;text-align:center;margin:0;max-width:300px}@media(orientation:landscape)and(max-height:550px){main{flex-direction:row;gap:32px}.flowers{height:90svh;width:auto}h1{font-size:25px}}
</style></head><body><main><div class="flowers" role="img" aria-label="A colourful animated ASCII flower bouquet"><video muted loop playsinline webkit-playsinline preload="auto" aria-hidden="true"></video></div><h1>Happy birthday,<span>sunshine</span></h1><button type="button" disabled>Загружаю цветы…</button><p id="status" role="status" aria-live="polite"></p></main><script>
const video=document.querySelector('video'),button=document.querySelector('button'),status=document.querySelector('#status');let ready=false,loading=false,blobUrl;
video.muted=true;video.defaultMuted=true;video.playsInline=true;
function failed(){button.disabled=false;button.textContent=ready?'Открыть цветок':'Повторить загрузку';status.textContent=ready?'Нажмите кнопку ещё раз для запуска.':'Не удалось загрузить видео. Проверьте интернет и повторите.'}
function play(){video.muted=true;const result=video.play();if(result)result.catch(failed)}
async function load(){if(loading)return;loading=true;ready=false;button.disabled=true;button.textContent='Загружаю цветы…';status.textContent='';try{const response=await fetch('flowers.mp4?v=2',{cache:'force-cache'});if(!response.ok)throw Error('Video unavailable');const bytes=await response.arrayBuffer();if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));video.src=blobUrl;ready=true;video.load();button.disabled=false;button.textContent='Открыть цветок';play()}catch(e){failed()}finally{loading=false}}
button.addEventListener('click',()=>{if(!ready){load();return}status.textContent='';if(!video.paused)video.currentTime=0;play()});
video.addEventListener('playing',()=>{button.disabled=false;button.textContent='Начать заново';status.textContent=''});
video.addEventListener('error',()=>{ready=false;failed()});
video.addEventListener('waiting',()=>{status.textContent='Видео загружается…'});
load();
</script></body></html>
