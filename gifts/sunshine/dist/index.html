<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030305"><meta name="description" content="A little bouquet of light, just for you."><title>Happy birthday, sunshine</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#030305;color:#f9edce;min-height:100%;font-family:Georgia,'Times New Roman',serif}body{overflow-x:hidden}main{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top) 20px max(24px,env(safe-area-inset-bottom));position:relative}canvas{display:block;width:min(100vw,560px);height:min(69svh,690px);touch-action:pan-y}h1{font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.15;margin:0;text-align:center;letter-spacing:-.035em;opacity:0;animation:appear 2s 2.8s forwards}h1 span{display:block;font-style:italic;color:#f5d998;font-size:1.15em;margin-top:4px}button{color:#aa9f89;background:none;border:0;border-bottom:1px solid #4c4537;padding:9px 1px;font:14px Georgia;letter-spacing:.04em;margin-top:24px;cursor:pointer;opacity:0;animation:appear 2s 3.8s forwards}button:focus-visible{outline:2px solid #f5d998;outline-offset:6px}@keyframes appear{to{opacity:1}}@media(prefers-reduced-motion:reduce){h1,button{animation:none;opacity:1}}@media(max-height:600px)and(orientation:landscape){canvas{height:65svh}h1{font-size:25px}h1 span{display:inline;margin-left:8px}button{margin-top:8px}}
</style></head><body><main><canvas aria-label="A shimmering bouquet of pink, red, ivory and golden lilies" role="img"></canvas><h1>Happy birthday,<span>sunshine</span></h1><button type="button" id="replay">Make it bloom again</button></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W,H,dpr,begin=performance.now(),points=[],stars=[];let seed=42;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const motion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function dot(x,y,z,c,size=1){points.push({x,y,z,c,size,r:rand()})}
const flowers=[[-74,60,-15,54,[240,190,35],-.3],[58,40,-10,66,[244,225,181],.15],[-51,-40,18,67,[231,113,202],-.13],[83,-55,-15,59,[171,44,77],.4],[2,-132,18,72,[230,40,52],.16],[-78,-161,-20,51,[250,233,206],-.25],[80,-177,-28,52,[231,202,44],.27],[5,-224,-38,44,[224,174,133],.1],[93,118,-12,43,[166,32,46],.4],[-73,133,8,44,[246,203,48],-.5],[8,139,28,63,[239,206,158],.2]];
for(const [cx,cy,cz,baseR,color,tilt] of flowers){ const R=baseR*1.32;
 for(let s=0;s<500;s++){let t=s/500;dot(cx*(1-t)+Math.sin(t*3)*7,cy*(1-t)+242*t,cz*(1-t),[54+rand()*35,104+rand()*65,34],.75)}
 for(let p=0;p<6;p++){let a=p*Math.PI/3+tilt;for(let j=0;j<1848;j++){let t=(Math.floor(j/33)+.4)/56,v=((j%33)/32)*2-1,width=Math.sin(Math.PI*t)**1.18*R*.31;let along=t*R;let x=along*Math.cos(a)-v*width*Math.sin(a),y=along*Math.sin(a)+v*width*Math.cos(a);let z=cz+Math.sin(t*Math.PI)*23-t*t*17+v*v*10;let light=.64+.26*rand()+.20*Math.abs(v)-.22*(1-t);dot(cx+x,cy+y*.9,z,color.map(c=>Math.min(255,c*light)),.68+rand()*.38)}}
 for(let k=0;k<6;k++){let a=k*Math.PI/3;for(let j=0;j<50;j++){let t=j/50;dot(cx+Math.cos(a)*t*16,cy+Math.sin(a)*t*15-4,cz+23+t*15,[159,140,57],.6)}for(let j=0;j<25;j++)dot(cx+Math.cos(a)*16+(rand()-.5)*5,cy+Math.sin(a)*15-4+(rand()-.5)*5,cz+39,[235,190,69],1)}
}
for(let k=0;k<24;k++){let x=(rand()-.5)*230,y=30+rand()*190;for(let j=0;j<170;j++){let t=rand(),v=(rand()-.5)*2;dot(x*(1-t),y+(242-y)*t-Math.sin(t*Math.PI)*28, -20+v*9,[42+rand()*25,94+rand()*65,38],.7);dot(x*(1-t)+Math.sin(Math.PI*t)*v*12,y+(242-y)*t,-17,[48,128+rand()*45,42],.65)}}
for(let i=0;i<100;i++)stars.push({x:rand(),y:rand(),r:rand(),p:rand()*7});
points.sort((a,b)=>a.z-b.z);
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function render(now){ctx.clearRect(0,0,W,H);let elapsed=(now-begin)/1000,progress=motion?1:Math.min(1,elapsed/3.8);for(let s of stars){ctx.fillStyle=`rgba(245,233,195,${.12+s.r*.35*(.6+.4*Math.sin(now*.0006+s.p))})`;ctx.fillRect(s.x*W,s.y*H, s.r> .85?1.4:.7,s.r> .85?1.4:.7)}let scale=Math.min(W/330,H/610)*.96;let angle=motion?0:Math.sin(now*.00034)*.12;let ca=Math.cos(angle),sa=Math.sin(angle);ctx.globalCompositeOperation='source-over';for(const p of points){let stem=p.c[1]>p.c[0]*1.25&&p.c[1]>p.c[2]*1.3;let stage=stem?(242-p.y)/600:.28+(150-p.y)/1400;let reveal=motion?1:Math.max(0,Math.min(1,(progress-stage)/.24));if(!reveal)continue;let x=p.x*ca+p.z*sa,z=p.z*ca-p.x*sa;let depth=1+z/900;let px=W/2+x*scale*depth,py=H*.49+(p.y+(1-reveal)*48)*scale;let [r,g,b]=p.c;ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},${(.9*reveal).toFixed(2)})`;ctx.fillRect(px,py,p.size*scale,p.size*scale)}ctx.globalCompositeOperation='source-over';if(!motion||progress<1)requestAnimationFrame(render)}requestAnimationFrame(render);document.querySelector('#replay').onclick=()=>{begin=performance.now();if(motion)requestAnimationFrame(render)};
</script></body></html>
